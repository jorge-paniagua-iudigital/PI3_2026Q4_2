name: Ejecución Automática de Notebook

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install jupyter nbconvert

      - name: Ejecutar Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute src/sincronicas/Semana_2EA2.ipynb --inplace

      - name: Confirmar y subir cambios generados (.txt y .ipynb)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "ci: actualización automática del notebook y reporte .txt [skip ci]"
            git push
          fi